name: Validate Bluey lessons and interactions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/validate_episodes.py
      - run: node scripts/validate-episodes.cjs
      - run: node --test tests/validation.test.cjs tests/qa2.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/bluey-test-tools" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/bluey-test-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser regressions at repository subpath
        env:
          BASE_URL: http://127.0.0.1:8001/bluey-learning-hub/
        run: |
          python3 -m http.server 8001 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/.." > "$RUNNER_TEMP/bluey-server.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then break; fi
            sleep 0.25
          done
          NODE_PATH="$RUNNER_TEMP/bluey-test-tools/node_modules" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
